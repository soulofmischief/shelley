name: Release

on:
  workflow_run:
    workflows: ["Test"]
    branches:
      - main
    types:
      - completed

permissions:
  contents: write

jobs:
  goreleaser:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Fetch embedded exe-scroll binaries
        run: python3 scripts/fetch-exe-scroll.py --all --wait 1800

      - name: Generate version tag
        id: version
        run: |
          # Get commit count as version number
          COUNT=$(git rev-list --count HEAD)
          SHORT_SHA=$(git rev-parse --short=6 HEAD)
          # Convert 6-char hex SHA to octal, prefixed with 9 to ensure valid semver
          SHA_OCTAL=$(printf '%o' "0x${SHORT_SHA}")
          VERSION="0.${COUNT}.9${SHA_OCTAL}"
          TAG="v${VERSION}"

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

          # Create and push tag
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG} (${SHORT_SHA})"
          git push origin "${TAG}"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Build UI
        env:
          # Drop JS source maps from release binaries (~6MB compressed) since
          # they're only useful with devtools open. Dev builds keep them.
          NO_SOURCEMAPS: '1'
        run: |
          cd ui
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Build templates
        run: |
          for dir in templates/*/; do
            name=$(basename "$dir")
            echo "Creating $name.tar.gz..."
            tar -czf "templates/$name.tar.gz" -C "templates/$name" --exclude='.DS_Store' .
          done

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}

  macos-app:
    needs: goreleaser
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download Shelley binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ needs.goreleaser.outputs.tag }}" \
            -p "shelley_darwin_${{ matrix.arch }}" \
            -D .

      - name: Install app packaging dependencies
        run: brew install librsvg

      - name: Build DMG and app zip
        run: |
          chmod +x "shelley_darwin_${{ matrix.arch }}"
          ./scripts/build-macos-dmg.sh "${{ matrix.arch }}" \
            "shelley_darwin_${{ matrix.arch }}" \
            "${{ needs.goreleaser.outputs.version }}"

      - name: Upload macOS app artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.goreleaser.outputs.tag }}" \
            "Shelley_darwin_${{ matrix.arch }}.dmg" \
            "Shelley_darwin_${{ matrix.arch }}.zip" \
            --clobber
